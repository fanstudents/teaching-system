<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的課程成果 — 數位簡報室</title>
    <meta name="description" content="數位簡報室 — 學員個人課後成果紀錄">
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/base.css">
    <style>
        * , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fbfaf8;
            color: #232019;
            min-height: 100vh;
            overflow-anchor: none;
            padding: 48px 24px 90px;
        }

        .wrap { max-width: 900px; margin: 0 auto; }

        /* ── 頁首 ── */
        .m-header { margin-bottom: 20px; }
        .m-student-name { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.01em; color: #1a1815; }
        .m-course-line {
            margin-top: 6px; font-size: 0.95rem; color: #726b5c;
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        }
        .m-course-line b { color: #4a4436; font-weight: 600; }
        .m-course-line .dot { opacity: 0.5; }

        /* ── 成果徽章列（一眼看到成果感）── */
        .m-badges { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 32px; }
        .m-badge {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 0.85rem; font-weight: 700; color: #4a4436;
            background: #f2efe8; padding: 8px 16px; border-radius: 999px;
        }
        .m-badge b { font-size: 1rem; }
        .m-badge-hero { background: #fdece0; color: #a3491c; }
        .m-badge-hero b { color: #c2591f; }
        .m-badge-gold { background: #fdf1d6; color: #8a6208; }

        /* ── 開篇回饋（柔和色塊，不用邊框卡片）── */
        .m-narrative {
            margin-bottom: 32px; padding: 24px 28px; border-radius: 16px;
            background: linear-gradient(135deg, #fdf5ec 0%, #fbeee0 100%);
            font-size: 1.02rem; line-height: 1.9; color: #4a3a28;
            white-space: pre-wrap;
        }
        .m-narrative-loading {
            display: flex; align-items: center; gap: 8px;
            color: #a49a83; font-style: italic; font-size: 0.92rem;
            background: none; padding: 0;
        }

        /* ── 創辦人簽名（像在跟學員說話的小對話卡）── */
        .m-founder {
            display: flex; align-items: flex-start; gap: 12px;
            margin: 0 0 48px; padding: 14px 18px;
            background: #f5f2ec; border-radius: 14px;
        }
        .m-founder-avatar-wrap {
            width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
            background: #e8d7b8; color: #a3793f; font-weight: 800; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
        }
        .m-founder-avatar {
            position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
        }
        .m-founder-body { font-size: 0.85rem; color: #6b6252; line-height: 1.75; padding-top: 2px; }
        .m-founder-name { font-weight: 700; color: #3a3527; margin-bottom: 2px; }
        .m-founder a { color: #1f7a6c; font-weight: 700; text-decoration: none; }
        .m-founder a:hover { text-decoration: underline; }

        /* ── 區塊標題 ── */
        .m-section-title {
            font-size: 1.2rem; font-weight: 800; color: #1a1815;
            margin-bottom: 4px; display: flex; align-items: center; gap: 8px;
        }
        .m-section-sub { font-size: 0.84rem; color: #93897a; margin-bottom: 20px; }

        /* ── 作品成果 Portfolio Grid ── */
        .m-portfolio { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 48px; }
        @media (max-width: 620px) { .m-portfolio { grid-template-columns: 1fr; } }

        .port-card {
            border: 1px solid #e8e3d8; border-radius: 14px; overflow: hidden;
            background: #fff; display: flex; flex-direction: column;
            text-decoration: none; color: inherit;
            transition: transform 0.18s, box-shadow 0.18s;
        }
        .port-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(30,24,16,0.09); }
        .port-card.featured { grid-column: 1 / -1; }
        .port-card.featured .port-media { max-height: 480px; min-height: 240px; }

        /* 作品圖片完整顯示、絕不裁切——高矮胖瘦都讓學員看到完整的作品。
           min-height 保留版位：圖片載入前容器不能塌陷成 0，否則瀏覽器的
           lazy-load 偵測不到元素「進入畫面」，圖片會永遠卡在載入前狀態。 */
        .port-media {
            position: relative; width: 100%; min-height: 160px; max-height: 340px;
            background: #f2efe8; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .port-media img { width: 100%; height: auto; max-height: inherit; object-fit: contain; display: block; }

        /* 網頁作品：瀏覽器視窗造型 */
        .port-browser-bar {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 10px; background: #f2efe8; border-bottom: 1px solid #e8e3d8;
        }
        .port-browser-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .port-browser-url {
            margin-left: 6px; flex: 1; font-size: 0.7rem; color: #93897a;
            background: #fff; padding: 3px 10px; border-radius: 6px;
            border: 1px solid #e8e3d8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .port-web-body { position: relative; aspect-ratio: 16/9; overflow: hidden; background: #fff; }
        .port-card.featured .port-web-body { aspect-ratio: 21/8; }
        .port-web-body iframe {
            width: 400%; height: 400%; border: none;
            transform: scale(0.25); transform-origin: top left;
            pointer-events: none; background: #fff;
        }
        .port-web-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #c2b8a3; }

        .port-badge-tag {
            position: absolute; top: 10px; right: 10px;
            background: rgba(26,24,21,0.72); color: #fff;
            font-size: 0.68rem; padding: 4px 10px; border-radius: 999px;
            display: flex; align-items: center; gap: 3px;
        }

        .port-body { padding: 16px 18px 18px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .port-label { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px; }
        .port-label.label-image { color: #c2591f; }
        .port-label.label-web { color: #1f7a6c; }
        .port-title { font-size: 1rem; font-weight: 700; color: #1a1815; line-height: 1.4; }
        .port-text { font-size: 0.85rem; color: #4d473c; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
        .port-text a { color: #ad6b2e; }
        .port-link {
            margin-top: auto; padding-top: 10px;
            font-size: 0.82rem; font-weight: 700;
            display: flex; align-items: center; gap: 3px;
        }
        .port-link.link-web { color: #1f7a6c; }

        /* ── 課堂參與紀錄（活潑的彩色標籤列）── */
        .m-chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 40px; }
        .m-chip {
            font-size: 0.83rem; font-weight: 600; color: #4a4436;
            padding: 7px 15px; border-radius: 999px;
        }
        .m-chip b { font-weight: 800; }

        .m-empty { color: #93897a; font-size: 0.9rem; padding: 20px 0; }

        @media (max-width: 560px) {
            .m-student-name { font-size: 1.7rem; }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="m-header">
            <div class="m-student-name" id="studentNameEl">你</div>
            <div class="m-course-line">
                <b id="courseTitleEl">課程成果</b>
                <span class="dot">·</span>
                <span id="courseDateEl"></span>
            </div>
        </div>

        <div class="m-badges" id="badgesEl"></div>

        <div class="m-narrative" id="narrativeEl">
            <div class="m-narrative-loading">
                <span class="material-symbols-outlined" style="font-size:16px;">hourglass_top</span>
                正在整理你這堂課的學習成果...
            </div>
        </div>

        <div class="m-founder">
            <div class="m-founder-avatar-wrap">D
                <img class="m-founder-avatar" alt="樊松蒲 Dennis"
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTfgfWcWa_JFQWPyal4fti-rDWXS8pTSi4P0OVrAtcn8ydMJp0PNvNwqOw&s=10"
                    onerror="this.remove()">
            </div>
            <div class="m-founder-body">
                <div class="m-founder-name">樊松蒲 Dennis・數位簡報室創辦人</div>
                如果覺得課程不錯，可以參加數位簡報室
                <a href="https://tbr.digital" target="_blank" rel="noopener">tbr.digital</a>
                的其他課程，或是在社群上幫我們分享心得喔！也歡迎在
                <a href="https://www.threads.com/@tbr.digital" target="_blank" rel="noopener">Threads</a>
                上追蹤我、標記我分享你今天的學習感想。
            </div>
        </div>

        <div id="portfolioSection">
            <div class="m-section-title">🎨 你的創作成果</div>
            <div class="m-section-sub">這堂課你實際做出來的東西</div>
            <div class="m-portfolio" id="portfolioEl"></div>
        </div>

        <div id="othersSection">
            <div class="m-section-title">📚 課堂參與紀錄</div>
            <div class="m-section-sub">這堂課你還參與了這些互動</div>
            <div class="m-chips" id="chipsEl"></div>
        </div>
    </div>

    <script type="module">
        import { db, ai } from './scripts/supabase.js';

        const params = new URLSearchParams(location.search);
        const sessionId = params.get('session') || '';
        const email = params.get('email') || '';
        const name = params.get('name') || '你';

        const mi = (n, s = 16) => `<span class="material-symbols-outlined" style="font-size:${s}px;vertical-align:middle">${n}</span>`;
        const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        /** 把純文字裡的網址轉成可點擊的超連結（esc() 之後才呼叫，安全） */
        function autoLink(escapedText) {
            return escapedText.replace(/(https?:\/\/[^\s<]+)/g, url =>
                `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
        }

        // 標籤用的活潑配色（依標籤文字輪流分配，固定不隨機，重整頁面顏色不會亂跳）
        const CHIP_COLORS = [
            { bg: '#eaf3ee', fg: '#2f7d3f' }, { bg: '#eef1fb', fg: '#3d4fb0' },
            { bg: '#fdeef0', fg: '#b1483a' }, { bg: '#fdf1d6', fg: '#8a6208' },
            { bg: '#f3ecfb', fg: '#6b3fa0' }, { bg: '#e6f4f6', fg: '#1f7a6c' },
        ];

        const TYPE_META = {
            quiz: { label: '測驗' },
            truefalse: { label: '是非題' },
            multiChoice: { label: '選擇' },
            opentext: { label: '開放回答' },
            wordcloud: { label: '文字雲' },
            poll: { label: '投票' },
            matching: { label: '配對' },
            ordering: { label: '排序' },
            fillblank: { label: '填空' },
            scale: { label: '量表' },
            buzzer: { label: '搶答' },
            copycard: { label: '提示詞練習' },
            document: { label: '文件' },
            survey: { label: '問卷' },
            assessment: { label: '評量' },
            skillBattle: { label: '競技場' },
            homework: { label: '作業' },
            webProject: { label: '網頁作品' },
            hotspot: { label: '標註' },
            icebreaker: { label: '破冰' },
            join: { label: '出席' },
        };
        const metaFor = t => TYPE_META[t] || { label: t || '活動' };

        function parseState(raw) {
            if (!raw) return {};
            if (typeof raw === 'object') return raw;
            try { return JSON.parse(raw); } catch { return {}; }
        }
        function formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
        }

        /** 網頁作品一律轉成瀏覽器視窗造型的可點擊卡片，絕不顯示原始程式碼 */
        function buildWebCard(question, content) {
            const c = String(content || '').trim();
            if (!c) return null;
            const isRawHtml = /<!DOCTYPE html/i.test(c) || /<html[\s>]/i.test(c);
            const isUrl = /^https?:\/\//i.test(c);
            let href, iframeAttr, urlLabel;
            if (isUrl) {
                href = c;
                iframeAttr = `src="${esc(c)}" sandbox="allow-scripts allow-same-origin"`;
                try { urlLabel = new URL(c).hostname; } catch { urlLabel = c; }
            } else {
                const blob = new Blob([c], { type: 'text/html' });
                href = URL.createObjectURL(blob);
                iframeAttr = `srcdoc="${esc(c)}" sandbox="allow-scripts"`;
                urlLabel = '你的網頁作品';
            }
            const titleMatch = c.match(/<title[^>]*>([^<]*)<\/title>/i);
            const title = titleMatch?.[1]?.trim() || question;
            return { href, iframeAttr, title, urlLabel, hasPreview: isRawHtml || isUrl };
        }

        function isHomeworkContentRow(row) {
            return /__v\d+$/.test(row.element_id || '');
        }

        /** 解析單筆 submission */
        function renderEntry(row) {
            const isHwContent = isHomeworkContentRow(row);
            const meta = isHwContent ? TYPE_META.homework : metaFor(row.type);
            const question = row.assignment_title || meta.label;
            let imageUrl = '', promptText = '', webCard = null, plainAnswer = '';

            let parsedJson = null;
            if (typeof row.content === 'string' && row.content.trim().startsWith('{')) {
                try { parsedJson = JSON.parse(row.content); } catch { /* 不是 JSON */ }
            }

            if (parsedJson && parsedJson.image) {
                imageUrl = parsedJson.image;
                promptText = parsedJson.prompt || '';
            } else if (row.file_url) {
                imageUrl = row.file_url;
                promptText = row.content || '';
            } else if (row.type === 'webProject') {
                webCard = buildWebCard(question, row.content);
            } else {
                plainAnswer = row.content || '';
            }

            return { question, meta, imageUrl, promptText, webCard, plainAnswer, isHwContent };
        }

        // 「作品成果」只放真正的產出（圖片、網頁）；提示詞練習／開放回答／
        // 競技場等屬於「過程」而非「成果」，歸到下方課堂參與紀錄的標籤列即可，
        // 避免稀釋真正作品的份量。
        function classify(entry) {
            if (entry.imageUrl || entry.webCard) return 'portfolio';
            return 'other';
        }

        /** 給 AI 生成回饋用的精簡摘要 */
        function summarizeForAI(row) {
            const entry = renderEntry(row);
            let desc;
            if (entry.webCard) desc = '完成並提交了一個網頁作品';
            else if (entry.imageUrl) desc = `上傳了作品圖片，說明／提示詞：${(entry.promptText || '').replace(/\s+/g, ' ').slice(0, 100)}`;
            else desc = (entry.plainAnswer || '').replace(/\s+/g, ' ').slice(0, 100);
            return `- [${entry.meta.label}] ${entry.question}：${desc}`;
        }

        async function findSessionInfo(sid) {
            let { data } = await db.select('project_sessions', { filter: { session_code: `eq.${sid}` }, limit: 1 });
            if (!data?.length) {
                ({ data } = await db.select('project_sessions', { filter: { id: `eq.${sid}` }, limit: 1 }));
            }
            const session = data?.[0];
            if (!session) return { courseTitle: '課程成果', date: '' };
            let courseTitle = '課程成果';
            if (session.project_id) {
                const { data: proj } = await db.select('projects', { filter: { id: `eq.${session.project_id}` }, limit: 1 });
                if (proj?.[0]?.name) courseTitle = proj[0].name;
            }
            return { courseTitle, date: session.date || '' };
        }

        async function loadSubmissions() {
            const { data } = await db.select('submissions', {
                filter: { session_id: `eq.${sessionId}`, student_email: `eq.${email}` },
                order: 'created_at.asc',
            });
            const rows = data || [];

            // homework 會產生兩筆列：一筆純計分（type=homework，空內容），
            // 另一筆才是真實內容（帶版本號 element_id）。既有 homework.js 存檔
            // 流程有個 bug：真實內容那筆的 student_email 常被存成空字串，
            // 這裡改用 student_name + 版本化 element_id 把它找回來。
            const emptyHwRows = rows.filter(r => r.type === 'homework' && !r.content && !r.file_url);
            let hwContentRows = [];
            if (emptyHwRows.length && name) {
                const { data: byName } = await db.select('submissions', {
                    filter: { session_id: `eq.${sessionId}`, student_name: `eq.${name}` },
                });
                hwContentRows = (byName || []).filter(r =>
                    emptyHwRows.some(hw => r.element_id?.startsWith(hw.element_id + '__v'))
                );
            }

            const displayRows = [
                ...rows.filter(r => !(r.type === 'homework' && !r.content && !r.file_url)),
                ...hwContentRows,
            ].sort((a, b) => new Date(a.submitted_at || a.created_at) - new Date(b.submitted_at || b.created_at));

            return { allRows: rows, displayRows };
        }

        /**
         * 只挑對這位學員「正面、值得鼓勵」的班級比較，沒有就回傳空陣列
         * （絕不提到低於平均、落後等負面比較，也不講具體班級人數/名次）
         */
        async function computeClassmateHighlights() {
            const { data } = await db.select('submissions', { filter: { session_id: `eq.${sessionId}` } });
            const rows = data || [];

            // 學員在不同互動元件裡常常自己重複輸入姓名/email（不是登入帳號），
            // 同一個人很容易因為打錯字被系統當成好幾個不同的人。姓名比 email
            // 更少打錯，這裡改用姓名為主要識別依據，降低重複計算人數的機率。
            const byStudent = new Map();
            for (const r of rows) {
                const nm = (r.student_name || '').trim();
                const em = (r.student_email || '').trim().toLowerCase();
                const key = nm || em || '?';
                if (!byStudent.has(key)) byStudent.set(key, { activities: 0, score: 0 });
                const isEmptyHwScoring = r.type === 'homework' && !r.content && !r.file_url;
                const st = byStudent.get(key);
                if (!isEmptyHwScoring) st.activities++;
                st.score += (parseState(r.state)._awarded || 0);
            }

            const myKey = (name || '').trim() || (email || '').trim().toLowerCase();
            const me = byStudent.get(myKey);
            if (!me || byStudent.size < 3) return [];

            const sortedByActivities = [...byStudent.values()].sort((a, b) => b.activities - a.activities);
            const sortedByScore = [...byStudent.values()].sort((a, b) => b.score - a.score);
            const activityRank = sortedByActivities.indexOf(me) + 1;
            const scoreRank = sortedByScore.indexOf(me) + 1;
            const topThreshold = Math.max(3, Math.ceil(byStudent.size * 0.3));

            const others = [...byStudent.values()].filter(v => v !== me);
            const avgActivities = others.reduce((s, o) => s + o.activities, 0) / others.length;
            const avgScore = others.reduce((s, o) => s + o.score, 0) / others.length;

            const highlights = [];
            if (activityRank <= topThreshold) highlights.push(`完成的活動數在班上名列前茅`);
            else if (me.activities > avgActivities) highlights.push(`完成的活動數比班上平均還要多`);
            if (scoreRank <= topThreshold) highlights.push(`累積得分在班上名列前茅`);
            else if (me.score > avgScore) highlights.push(`累積得分高於班上平均`);
            return highlights;
        }

        /**
         * 敘事文字才需要快取（AI 生成，成本較高）；班級比較亮點只是
         * 查資料庫、成本很低，每次都重新算，不受敘事快取影響
         * （否則已快取過的學員永遠看不到「表現名列前茅」徽章）。
         */
        async function getOrCreateNarrative(courseTitle, displayRows, highlights) {
            const { data: cached } = await db.select('memoir_summaries', {
                filter: { session_id: `eq.${sessionId}`, student_email: `eq.${email}` },
                limit: 1,
            });
            if (cached?.[0]?.summary) return cached[0].summary;

            if (!displayRows.length) {
                return `這堂「${courseTitle}」還沒有留下太多紀錄，不過沒關係，學習本來就有快有慢——下一堂課再一起繼續累積吧！`;
            }

            const activityList = displayRows.map(summarizeForAI).join('\n');
            const highlightsText = highlights.length ? highlights.map(h => `- ${h}`).join('\n') : '';

            const prompt = `你是一位溫暖、擅長給予具體且真誠鼓勵的老師，請幫學員「${name}」寫一段簡短、有活力的課後回饋。

課程主題：${courseTitle}
這位學員在這堂課完成的活動：
${activityList}

${highlightsText
    ? `這位學員在班上表現的正面亮點（只能提到下面列出的內容，不要自己編造或猜測任何比較）：\n${highlightsText}`
    : '（沒有足夠資料可以跟其他同學比較，請不要提到任何比較或猜測，專注在鼓勵他的學習內容就好）'}

請寫 3 到 5 句話的繁體中文回饋，重點：
1. 簡短點出他這堂課學到／完成了什麼（引用實際內容，不要空泛的鼓勵語），語氣可以活潑一點、有精神一點，不要死板。
2. 如果有提供班上正面亮點，自然帶入 1 句，幫助他建立信心；沒有的話就不要提任何比較。
3. 完全不要編造他當天的心情、動機、為什麼來上課、教室場景等你不知道的資訊。
4. 不要下標題、不要條列、不要分段太多，直接輸出一小段連貫文字即可（這是頁面最上面的簡短開場，不是長篇文章）。`;

            let summary;
            try {
                summary = await ai.chat([{ role: 'user', content: prompt }], { maxTokens: 350 });
            } catch (e) {
                console.warn('[Memoir] AI 生成失敗:', e);
                summary = `這堂「${courseTitle}」，你完成了 ${displayRows.length} 項活動，每一項都是扎實的學習成果。`;
            }

            try {
                await db.insert('memoir_summaries', {
                    session_id: sessionId, student_email: email, student_name: name,
                    course_title: courseTitle, summary,
                }, { onConflict: 'session_id,student_email' });
            } catch (e) { console.warn('[Memoir] 快取寫入失敗:', e); }

            return summary;
        }

        function renderPortfolioCard(row, featured) {
            const entry = renderEntry(row);
            const cls = `port-card${featured ? ' featured' : ''}`;

            if (entry.webCard) {
                const wc = entry.webCard;
                return `
                    <a class="${cls}" href="${esc(wc.href)}" target="_blank" rel="noopener">
                        <div class="port-browser-bar">
                            <span class="port-browser-dot" style="background:#ff5f57;"></span>
                            <span class="port-browser-dot" style="background:#febc2e;"></span>
                            <span class="port-browser-dot" style="background:#28c840;"></span>
                            <span class="port-browser-url">${esc(wc.urlLabel)}</span>
                        </div>
                        <div class="port-web-body">
                            ${wc.hasPreview
                                ? `<iframe ${wc.iframeAttr} loading="lazy" tabindex="-1"></iframe>`
                                : `<div class="port-web-empty">${mi('web', 40)}</div>`}
                        </div>
                        <div class="port-body">
                            <div class="port-label label-web">${mi('web', 13)} ${esc(entry.meta.label)}</div>
                            <div class="port-title">${esc(wc.title)}</div>
                            <span class="port-link link-web">${mi('open_in_new', 14)} 開啟你的網頁作品</span>
                        </div>
                    </a>`;
            }

            if (entry.imageUrl) {
                return `
                    <div class="${cls}">
                        <div class="port-media">
                            <img src="${esc(entry.imageUrl)}" alt="作品圖片" loading="lazy">
                            <span class="port-badge-tag">${mi('photo_camera', 12)} 作品</span>
                        </div>
                        <div class="port-body">
                            <div class="port-label label-image">${mi('palette', 13)} ${esc(entry.meta.label)}</div>
                            <div class="port-title">${esc(entry.question)}</div>
                            ${entry.promptText ? `<div class="port-text">${autoLink(esc(entry.promptText))}</div>` : ''}
                        </div>
                    </div>`;
            }
            return '';
        }

        function renderBadges(portfolioCount, totalCount, highlights) {
            const badgesEl = document.getElementById('badgesEl');
            const parts = [];
            if (portfolioCount > 0) {
                parts.push(`<span class="m-badge m-badge-hero">${mi('celebration', 16)} <b>${portfolioCount}</b> 件作品</span>`);
            }
            parts.push(`<span class="m-badge">${mi('bolt', 16)} <b>${totalCount}</b> 次課堂互動</span>`);
            if (highlights.length) {
                parts.push(`<span class="m-badge m-badge-gold">${mi('emoji_events', 16)} 表現名列前茅</span>`);
            }
            badgesEl.innerHTML = parts.join('');
        }

        function renderPortfolioAndChips(displayRows) {
            const portfolioEl = document.getElementById('portfolioEl');
            const chipsEl = document.getElementById('chipsEl');
            const portfolioSection = document.getElementById('portfolioSection');
            const othersSection = document.getElementById('othersSection');

            const portfolioRows = [];
            const otherRows = [];
            for (const row of displayRows) {
                const entry = renderEntry(row);
                if (classify(entry) === 'portfolio') portfolioRows.push(row);
                else otherRows.push(row);
            }

            if (portfolioRows.length) {
                // 圖片作品優先當精選（視覺衝擊力比網頁預覽更強），沒有圖片就用第一個網頁作品
                const heroIdx = portfolioRows.findIndex(r => renderEntry(r).imageUrl) !== -1
                    ? portfolioRows.findIndex(r => renderEntry(r).imageUrl) : 0;
                portfolioEl.innerHTML = portfolioRows
                    .map((row, i) => renderPortfolioCard(row, i === heroIdx))
                    .join('');
            } else {
                portfolioSection.style.display = 'none';
            }

            if (otherRows.length) {
                const counts = new Map();
                for (const r of otherRows) {
                    const label = metaFor(r.type).label;
                    counts.set(label, (counts.get(label) || 0) + 1);
                }
                chipsEl.innerHTML = [...counts.entries()].map(([label, count], i) => {
                    const c = CHIP_COLORS[i % CHIP_COLORS.length];
                    return `<span class="m-chip" style="background:${c.bg};color:${c.fg};"><b>${count}</b> 次 ${esc(label)}</span>`;
                }).join('');
            } else {
                othersSection.style.display = 'none';
            }

            if (!displayRows.length) {
                portfolioSection.style.display = 'none';
                othersSection.style.display = 'none';
            }

            return { portfolioCount: portfolioRows.length };
        }

        async function main() {
            document.getElementById('studentNameEl').textContent = name;

            if (!sessionId || !email) {
                document.getElementById('courseTitleEl').textContent = '找不到你的成果紀錄';
                document.getElementById('narrativeEl').innerHTML = `<div class="m-narrative-loading">${mi('error', 16)} 網址缺少必要參數，請從課堂簡報頁面重新點擊連結。</div>`;
                document.getElementById('portfolioSection').style.display = 'none';
                document.getElementById('othersSection').style.display = 'none';
                return;
            }

            const [{ courseTitle, date }, { displayRows }] = await Promise.all([
                findSessionInfo(sessionId),
                loadSubmissions(),
            ]);

            document.getElementById('courseTitleEl').textContent = courseTitle;
            document.getElementById('courseDateEl').textContent = date ? formatDate(date) : '';

            const { portfolioCount } = renderPortfolioAndChips(displayRows);

            let highlights = [];
            try { highlights = await computeClassmateHighlights(); }
            catch (e) { console.warn('[Memoir] 班級比較計算失敗:', e); }
            renderBadges(portfolioCount, displayRows.length, highlights);

            const summary = await getOrCreateNarrative(courseTitle, displayRows, highlights);
            document.getElementById('narrativeEl').textContent = summary;
        }

        main();
    </script>
</body>

</html>
