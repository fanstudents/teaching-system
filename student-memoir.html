<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的課程成果 — 數位簡報室</title>
    <meta name="description" content="數位簡報室 — 學員個人課後成果紀錄">
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/base.css">
    <style>
        * , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fbfaf8;
            color: #232019;
            min-height: 100vh;
            overflow-anchor: none;
            padding: 56px 24px 90px;
        }

        .wrap { max-width: 860px; margin: 0 auto; }

        /* ── 頁首 ── */
        .m-header { margin-bottom: 40px; }
        .m-student-name { font-size: 2rem; font-weight: 800; letter-spacing: -0.01em; color: #1a1815; }
        .m-course-line {
            margin-top: 8px; font-size: 0.95rem; color: #726b5c;
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        }
        .m-course-line b { color: #4a4436; font-weight: 600; }
        .m-course-line .dot { opacity: 0.5; }

        /* ── 開篇回饋（純文字，不加卡片外框）── */
        .m-narrative {
            margin: 28px 0 8px;
            padding-top: 28px;
            border-top: 1px solid #e8e3d8;
            font-size: 1.02rem; line-height: 1.95; color: #34302a;
            white-space: pre-wrap;
        }
        .m-narrative-loading {
            display: flex; align-items: center; gap: 8px;
            color: #a49a83; font-style: italic; font-size: 0.92rem;
        }

        /* ── 創辦人簽名（安靜的簽名檔風格，非卡片）── */
        .m-founder {
            margin: 20px 0 48px; padding-top: 16px;
            font-size: 0.82rem; color: #93897a; line-height: 1.8;
        }
        .m-founder a { color: #ad6b2e; font-weight: 600; text-decoration: none; }
        .m-founder a:hover { text-decoration: underline; }

        /* ── 區塊標題 ── */
        .m-section-title {
            font-size: 1.05rem; font-weight: 700; color: #1a1815;
            margin-bottom: 4px;
        }
        .m-section-sub {
            font-size: 0.82rem; color: #93897a; margin-bottom: 20px;
        }

        /* ── 作品成果 Portfolio Grid ── */
        .m-portfolio { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 48px; }
        @media (max-width: 620px) { .m-portfolio { grid-template-columns: 1fr; } }

        .port-card {
            border: 1px solid #e8e3d8; border-radius: 12px; overflow: hidden;
            background: #fff; display: flex; flex-direction: column;
        }
        .port-media { position: relative; width: 100%; aspect-ratio: 16/10; background: #f2efe8; overflow: hidden; }
        .port-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .port-web-frame { width: 100%; height: 100%; position: relative; }
        .port-web-frame iframe {
            width: 400%; height: 400%; border: none;
            transform: scale(0.25); transform-origin: top left;
            pointer-events: none; background: #fff;
        }
        .port-web-badge {
            position: absolute; top: 8px; right: 8px;
            background: rgba(26,24,21,0.75); color: #fff;
            font-size: 0.68rem; padding: 3px 8px; border-radius: 999px;
            display: flex; align-items: center; gap: 3px;
        }
        .port-body { padding: 14px 16px 16px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .port-label { font-size: 0.72rem; color: #ad6b2e; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
        .port-title { font-size: 0.92rem; font-weight: 700; color: #1a1815; line-height: 1.4; }
        .port-text { font-size: 0.85rem; color: #4d473c; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
        .port-text a { color: #ad6b2e; }
        .port-link {
            margin-top: auto; padding-top: 8px;
            font-size: 0.8rem; color: #ad6b2e; font-weight: 600;
            display: flex; align-items: center; gap: 3px; text-decoration: none;
        }
        .port-link:hover { text-decoration: underline; }

        details.port-details summary { cursor: pointer; list-style: none; }
        details.port-details summary::-webkit-details-marker { display: none; }
        details.port-details summary .m-more { color: #ad6b2e; font-weight: 600; white-space: nowrap; }
        details.port-details[open] summary .m-more { display: none; }
        details.port-details .port-text-full { margin-top: 6px; }

        /* ── 其他課堂互動（安靜的標籤列）── */
        .m-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 40px; }
        .m-chip {
            font-size: 0.8rem; color: #5c5546; background: #f2efe8;
            padding: 6px 14px; border-radius: 999px;
        }
        .m-chip b { color: #1a1815; }

        .m-empty { color: #93897a; font-size: 0.9rem; padding: 20px 0; }

        @media (max-width: 560px) {
            .m-student-name { font-size: 1.6rem; }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="m-header">
            <div class="m-student-name" id="studentNameEl">你</div>
            <div class="m-course-line">
                <b id="courseTitleEl">課程成果</b>
                <span class="dot">·</span>
                <span id="courseDateEl"></span>
            </div>
        </div>

        <div class="m-narrative" id="narrativeEl">
            <div class="m-narrative-loading">
                <span class="material-symbols-outlined" style="font-size:16px;">hourglass_top</span>
                正在整理你這堂課的學習成果...
            </div>
        </div>

        <div class="m-founder">
            我是數位簡報室的創辦人 樊松蒲 Dennis，歡迎在我的
            <a href="https://www.threads.com/@tbr.digital" target="_blank" rel="noopener">Threads</a>
            上追蹤我，或標記我分享你今天的學習感想！
        </div>

        <div id="portfolioSection">
            <div class="m-section-title">作品成果</div>
            <div class="m-section-sub">這堂課你實際完成的產出</div>
            <div class="m-portfolio" id="portfolioEl"></div>
        </div>

        <div id="othersSection">
            <div class="m-section-title">其他課堂互動</div>
            <div class="m-chips" id="chipsEl"></div>
        </div>
    </div>

    <script type="module">
        import { db, ai } from './scripts/supabase.js';

        const params = new URLSearchParams(location.search);
        const sessionId = params.get('session') || '';
        const email = params.get('email') || '';
        const name = params.get('name') || '你';

        const mi = (n, s = 16) => `<span class="material-symbols-outlined" style="font-size:${s}px;vertical-align:middle">${n}</span>`;
        const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        /** 把純文字裡的網址轉成可點擊的超連結（esc() 之後才呼叫，安全） */
        function autoLink(escapedText) {
            return escapedText.replace(/(https?:\/\/[^\s<]+)/g, url =>
                `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
        }

        const TYPE_META = {
            quiz: { label: '測驗' },
            truefalse: { label: '是非題' },
            multiChoice: { label: '選擇' },
            opentext: { label: '開放回答' },
            wordcloud: { label: '文字雲' },
            poll: { label: '投票' },
            matching: { label: '配對' },
            ordering: { label: '排序' },
            fillblank: { label: '填空' },
            scale: { label: '量表' },
            buzzer: { label: '搶答' },
            copycard: { label: '複製卡' },
            document: { label: '文件' },
            survey: { label: '問卷' },
            assessment: { label: '評量' },
            skillBattle: { label: '競技場' },
            homework: { label: '作業' },
            webProject: { label: '網頁作品' },
            hotspot: { label: '標註' },
            icebreaker: { label: '破冰' },
            join: { label: '出席' },
        };
        const metaFor = t => TYPE_META[t] || { label: t || '活動' };

        function parseState(raw) {
            if (!raw) return {};
            if (typeof raw === 'object') return raw;
            try { return JSON.parse(raw); } catch { return {}; }
        }
        function formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
        }

        /** 網頁作品一律轉成可點擊卡片，絕不顯示原始程式碼；raw HTML 用 Blob URL 開啟 */
        function buildWebCard(question, content) {
            const c = String(content || '').trim();
            if (!c) return null;
            const isRawHtml = /<!DOCTYPE html/i.test(c) || /<html[\s>]/i.test(c);
            let href, iframeAttr;
            if (/^https?:\/\//i.test(c)) {
                href = c;
                iframeAttr = `src="${esc(c)}" sandbox="allow-scripts allow-same-origin"`;
            } else {
                // 不論是不是完整文件，只要是 webProject 類型都當作網頁內容處理，
                // 用 Blob URL 開啟，永遠不把程式碼原文印出來
                const blob = new Blob([c], { type: 'text/html' });
                href = URL.createObjectURL(blob);
                iframeAttr = `srcdoc="${esc(c)}" sandbox="allow-scripts"`;
            }
            const titleMatch = c.match(/<title[^>]*>([^<]*)<\/title>/i);
            const title = titleMatch?.[1]?.trim() || question;
            return { href, iframeAttr, title, hasPreview: isRawHtml || /^https?:\/\//i.test(c) };
        }

        /** 解析單筆 submission */
        /** 作業（homework）的真實內容列，element_id 會帶 __v 版本號後綴 */
        function isHomeworkContentRow(row) {
            return /__v\d+$/.test(row.element_id || '');
        }

        function renderEntry(row) {
            const isHwContent = isHomeworkContentRow(row);
            const meta = isHwContent ? TYPE_META.homework : metaFor(row.type);
            const question = row.assignment_title || meta.label;
            let imageUrl = '', promptText = '', webCard = null, plainAnswer = '';

            let parsedJson = null;
            if (typeof row.content === 'string' && row.content.trim().startsWith('{')) {
                try { parsedJson = JSON.parse(row.content); } catch { /* 不是 JSON */ }
            }

            if (parsedJson && parsedJson.image) {
                imageUrl = parsedJson.image;
                promptText = parsedJson.prompt || '';
            } else if (row.file_url) {
                imageUrl = row.file_url;
                promptText = row.content || '';
            } else if (row.type === 'webProject') {
                webCard = buildWebCard(question, row.content);
            } else {
                plainAnswer = row.content || '';
            }

            return { question, meta, imageUrl, promptText, webCard, plainAnswer, isHwContent };
        }

        const PORTFOLIO_TEXT_TYPES = new Set(['copycard', 'opentext', 'skillBattle', 'assessment', 'document']);

        function classify(row, entry) {
            if (entry.imageUrl || entry.webCard) return 'portfolio';
            if (entry.isHwContent && entry.plainAnswer?.trim()) return 'portfolio-text'; // 文字/連結繳交模式的作業
            if (PORTFOLIO_TEXT_TYPES.has(row.type) && entry.plainAnswer?.trim().length > 15) return 'portfolio-text';
            return 'other';
        }

        /** 給 AI 生成回饋用的精簡摘要 */
        function summarizeForAI(row) {
            const entry = renderEntry(row);
            let desc;
            if (entry.webCard) desc = '完成並提交了一個網頁作品';
            else if (entry.imageUrl) desc = `上傳了作品圖片，說明／提示詞：${(entry.promptText || '').replace(/\s+/g, ' ').slice(0, 100)}`;
            else desc = (entry.plainAnswer || '').replace(/\s+/g, ' ').slice(0, 100);
            return `- [${entry.meta.label}] ${entry.question}：${desc}`;
        }

        async function findSessionInfo(sid) {
            let { data } = await db.select('project_sessions', { filter: { session_code: `eq.${sid}` }, limit: 1 });
            if (!data?.length) {
                ({ data } = await db.select('project_sessions', { filter: { id: `eq.${sid}` }, limit: 1 }));
            }
            const session = data?.[0];
            if (!session) return { courseTitle: '課程成果', date: '' };
            let courseTitle = '課程成果';
            if (session.project_id) {
                const { data: proj } = await db.select('projects', { filter: { id: `eq.${session.project_id}` }, limit: 1 });
                if (proj?.[0]?.name) courseTitle = proj[0].name;
            }
            return { courseTitle, date: session.date || '' };
        }

        async function loadSubmissions() {
            const { data } = await db.select('submissions', {
                filter: { session_id: `eq.${sessionId}`, student_email: `eq.${email}` },
                order: 'created_at.asc',
            });
            const rows = data || [];

            // homework 會產生兩筆列：一筆純計分（type=homework，空內容），
            // 另一筆才是真實內容（帶版本號 element_id）。既有 homework.js 存檔
            // 流程有個 bug：真實內容那筆的 student_email 常被存成空字串，
            // 這裡改用 student_name + 版本化 element_id 把它找回來。
            const emptyHwRows = rows.filter(r => r.type === 'homework' && !r.content && !r.file_url);
            let hwContentRows = [];
            if (emptyHwRows.length && name) {
                const { data: byName } = await db.select('submissions', {
                    filter: { session_id: `eq.${sessionId}`, student_name: `eq.${name}` },
                });
                hwContentRows = (byName || []).filter(r =>
                    emptyHwRows.some(hw => r.element_id?.startsWith(hw.element_id + '__v'))
                );
            }

            const displayRows = [
                ...rows.filter(r => !(r.type === 'homework' && !r.content && !r.file_url)),
                ...hwContentRows,
            ].sort((a, b) => new Date(a.submitted_at || a.created_at) - new Date(b.submitted_at || b.created_at));

            return { allRows: rows, displayRows };
        }

        /**
         * 只挑對這位學員「正面、值得鼓勵」的班級比較，沒有就回傳空陣列
         * （絕不提到低於平均、落後等負面比較）
         */
        async function computeClassmateHighlights() {
            const { data } = await db.select('submissions', { filter: { session_id: `eq.${sessionId}` } });
            const rows = data || [];

            // 學員在不同互動元件裡常常自己重複輸入姓名/email（不是登入帳號），
            // 同一個人很容易因為打錯字（例如 gmail 打成 gamil、漏了 .net）
            // 被系統當成好幾個不同的人。姓名比 email 更少打錯，這裡改用姓名
            // 為主要識別依據，只有姓名是空的才退回 email，減少重複計算人數。
            const byStudent = new Map();
            for (const r of rows) {
                const nm = (r.student_name || '').trim();
                const em = (r.student_email || '').trim().toLowerCase();
                const key = nm || em || '?';
                if (!byStudent.has(key)) byStudent.set(key, { activities: 0, score: 0 });
                const isEmptyHwScoring = r.type === 'homework' && !r.content && !r.file_url;
                const st = byStudent.get(key);
                if (!isEmptyHwScoring) st.activities++;
                st.score += (parseState(r.state)._awarded || 0);
            }

            const myKey = (name || '').trim() || (email || '').trim().toLowerCase();
            const me = byStudent.get(myKey);
            if (!me || byStudent.size < 3) return [];

            const sortedByActivities = [...byStudent.values()].sort((a, b) => b.activities - a.activities);
            const sortedByScore = [...byStudent.values()].sort((a, b) => b.score - a.score);
            const activityRank = sortedByActivities.indexOf(me) + 1;
            const scoreRank = sortedByScore.indexOf(me) + 1;
            const topThreshold = Math.max(3, Math.ceil(byStudent.size * 0.3));

            const others = [...byStudent.values()].filter(v => v !== me);
            const avgActivities = others.reduce((s, o) => s + o.activities, 0) / others.length;
            const avgScore = others.reduce((s, o) => s + o.score, 0) / others.length;

            // 注意：不要講出具體班級人數或名次（例如「全班 71 位同學中排名第 X」）。
            // 學員自填的姓名/email 品質沒辦法保證完全去重乾淨，講出一個可能
            // 不準確的精確數字，一旦被老師或學員發現對不上，會直接破壞信任感。
            // 只用「名列前茅／高於平均」這種質化描述，不承諾具體精確度。
            const highlights = [];
            if (activityRank <= topThreshold) {
                highlights.push(`完成的活動數在班上名列前茅`);
            } else if (me.activities > avgActivities) {
                highlights.push(`完成的活動數比班上平均還要多`);
            }
            if (scoreRank <= topThreshold) {
                highlights.push(`累積得分在班上名列前茅`);
            } else if (me.score > avgScore) {
                highlights.push(`累積得分高於班上平均`);
            }
            return highlights;
        }

        async function getOrCreateNarrative(courseTitle, displayRows) {
            const { data: cached } = await db.select('memoir_summaries', {
                filter: { session_id: `eq.${sessionId}`, student_email: `eq.${email}` },
                limit: 1,
            });
            if (cached?.[0]?.summary) return cached[0].summary;

            if (!displayRows.length) {
                return `這堂「${courseTitle}」還沒有留下太多紀錄，不過沒關係，學習本來就有快有慢——下一堂課再一起繼續累積吧！`;
            }

            const activityList = displayRows.map(summarizeForAI).join('\n');
            let highlights = [];
            try { highlights = await computeClassmateHighlights(); }
            catch (e) { console.warn('[Memoir] 班級比較計算失敗:', e); }
            const highlightsText = highlights.length ? highlights.map(h => `- ${h}`).join('\n') : '';

            const prompt = `你是一位溫暖、擅長給予具體且真誠鼓勵的老師，請幫學員「${name}」寫一段簡短的課後回饋。

課程主題：${courseTitle}
這位學員在這堂課完成的活動：
${activityList}

${highlightsText
    ? `這位學員在班上表現的正面亮點（只能提到下面列出的內容，不要自己編造或猜測任何比較）：\n${highlightsText}`
    : '（沒有足夠資料可以跟其他同學比較，請不要提到任何比較或猜測，專注在鼓勵他的學習內容就好）'}

請寫 3 到 5 句話的繁體中文回饋，重點：
1. 簡短點出他這堂課學到／完成了什麼（引用實際內容，不要空泛的鼓勵語）。
2. 如果有提供班上正面亮點，自然帶入 1 句，幫助他建立信心；沒有的話就不要提任何比較。
3. 完全不要編造他當天的心情、動機、為什麼來上課、教室場景等你不知道的資訊。
4. 不要下標題、不要條列、不要分段太多，直接輸出一小段連貫文字即可（這是頁面最上面的簡短開場，不是長篇文章）。`;

            let summary;
            try {
                summary = await ai.chat([{ role: 'user', content: prompt }], { maxTokens: 350 });
            } catch (e) {
                console.warn('[Memoir] AI 生成失敗:', e);
                summary = `這堂「${courseTitle}」，你完成了 ${displayRows.length} 項活動，每一項都是扎實的學習成果。`;
            }

            try {
                await db.insert('memoir_summaries', {
                    session_id: sessionId, student_email: email, student_name: name,
                    course_title: courseTitle, summary,
                }, { onConflict: 'session_id,student_email' });
            } catch (e) { console.warn('[Memoir] 快取寫入失敗:', e); }

            return summary;
        }

        function renderPortfolioCard(row) {
            const entry = renderEntry(row);

            if (entry.webCard) {
                const wc = entry.webCard;
                return `
                    <a class="port-card" href="${esc(wc.href)}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;">
                        <div class="port-media">
                            ${wc.hasPreview
                                ? `<div class="port-web-frame"><iframe ${wc.iframeAttr} loading="lazy" tabindex="-1"></iframe></div>`
                                : `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#c2b8a3;">${mi('web', 40)}</div>`}
                            <span class="port-web-badge">${mi('open_in_new', 12)} 網頁作品</span>
                        </div>
                        <div class="port-body">
                            <div class="port-label">${esc(entry.meta.label)}</div>
                            <div class="port-title">${esc(wc.title)}</div>
                            <span class="port-link">${mi('open_in_new', 13)} 開啟你的網頁作品</span>
                        </div>
                    </a>`;
            }

            if (entry.imageUrl) {
                return `
                    <div class="port-card">
                        <div class="port-media"><img src="${esc(entry.imageUrl)}" alt="作品圖片" loading="lazy"></div>
                        <div class="port-body">
                            <div class="port-label">${esc(entry.meta.label)}</div>
                            <div class="port-title">${esc(entry.question)}</div>
                            ${entry.promptText ? `<div class="port-text">${autoLink(esc(entry.promptText))}</div>` : ''}
                        </div>
                    </div>`;
            }

            // 文字型作品（複製卡 / 開放回答 / 競技場 等）
            const linked = autoLink(esc(entry.plainAnswer));
            const isLong = entry.plainAnswer.length > 140;
            const state = parseState(row.state);
            const skillNote = row.type === 'skillBattle' && state.feedback
                ? `<div class="port-text" style="opacity:0.75;margin-top:2px;">${mi('smart_toy', 13)} AI 評語：${esc(state.feedback)}</div>` : '';

            return `
                <div class="port-card">
                    <div class="port-body">
                        <div class="port-label">${esc(entry.meta.label)}</div>
                        <div class="port-title">${esc(entry.question)}</div>
                        ${isLong
                            ? `<details class="port-details"><summary>${linked.replace(/<[^>]+>/g, '').slice(0, 100)}...　<span class="m-more">展開全文</span></summary><div class="port-text-full port-text">${linked}</div></details>`
                            : `<div class="port-text">${linked}</div>`}
                        ${skillNote}
                    </div>
                </div>`;
        }

        function renderPortfolioAndChips(displayRows) {
            const portfolioEl = document.getElementById('portfolioEl');
            const chipsEl = document.getElementById('chipsEl');
            const portfolioSection = document.getElementById('portfolioSection');
            const othersSection = document.getElementById('othersSection');

            const portfolioRows = [];
            const otherRows = [];
            for (const row of displayRows) {
                const entry = renderEntry(row);
                const kind = classify(row, entry);
                if (kind === 'portfolio' || kind === 'portfolio-text') portfolioRows.push(row);
                else otherRows.push(row);
            }

            if (portfolioRows.length) {
                portfolioEl.innerHTML = portfolioRows.map(renderPortfolioCard).join('');
            } else {
                portfolioSection.style.display = 'none';
            }

            if (otherRows.length) {
                const counts = new Map();
                for (const r of otherRows) {
                    const label = metaFor(r.type).label;
                    counts.set(label, (counts.get(label) || 0) + 1);
                }
                chipsEl.innerHTML = [...counts.entries()]
                    .map(([label, count]) => `<span class="m-chip"><b>${count}</b> 次 ${esc(label)}</span>`)
                    .join('');
            } else {
                othersSection.style.display = 'none';
            }

            if (!displayRows.length) {
                portfolioSection.style.display = 'none';
                othersSection.style.display = 'none';
            }
        }

        async function main() {
            document.getElementById('studentNameEl').textContent = name;

            if (!sessionId || !email) {
                document.getElementById('courseTitleEl').textContent = '找不到你的成果紀錄';
                document.getElementById('narrativeEl').innerHTML = `<div class="m-narrative-loading">${mi('error', 16)} 網址缺少必要參數，請從課堂簡報頁面重新點擊連結。</div>`;
                document.getElementById('portfolioSection').style.display = 'none';
                document.getElementById('othersSection').style.display = 'none';
                return;
            }

            const [{ courseTitle, date }, { displayRows }] = await Promise.all([
                findSessionInfo(sessionId),
                loadSubmissions(),
            ]);

            document.getElementById('courseTitleEl').textContent = courseTitle;
            document.getElementById('courseDateEl').textContent = date ? formatDate(date) : '';

            renderPortfolioAndChips(displayRows);

            const narrative = await getOrCreateNarrative(courseTitle, displayRows);
            document.getElementById('narrativeEl').textContent = narrative;
        }

        main();
    </script>
</body>

</html>
